<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="theme-color" content="#1F4532">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="7Acre Leads">
<title>Outreach tracker</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-512.png">
<style>:root{--green:#1F4532;--fair:#285640;--gold:#C9A24A;--lgold:#D8B566;--cream:#F4EEDF;--ink:#0F1F18;--line:#ddd3bd;--muted:#5b6b62;--red:#9b2c1f;--redbg:#fbe9e5;--card:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 12px 96px}
.hidden{display:none!important}
/* lock screen */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--green)}
.lockbox{width:100%;max-width:360px;background:var(--cream);border-radius:18px;padding:28px 22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lockbox h1{margin:10px 0 4px;font-size:22px;color:var(--green)}
.lockbox p{margin:0 0 18px;color:var(--muted);font-size:14px}
.lockbox img{height:34px}
.field{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:18px;outline:none}
.field:focus{border-color:var(--green)}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--green)}
.btn-main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:17px}
.btn-main:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.toprow{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px}
.toprow img{height:22px}
.toprow .ttl{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 10px;font-size:14px;font-weight:600}
nav.tabs{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 8px 8px}
.tab{background:transparent;border:0;color:#d9e4dc;border-radius:10px;padding:6px 2px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tab .ic{font-size:17px;line-height:1.1}
.tab .n{font-size:11px;opacity:.9}
.tab.on{background:var(--cream);color:var(--green)}
/* banner */
.banner{margin:10px 0 0;padding:10px 12px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff}
.banner span{flex:1;min-width:0}
.banner.nag{background:var(--redbg);border-color:#e3b0a6;color:var(--red);font-weight:600}
.banner button{border:0;border-radius:10px;background:var(--green);color:#fff;padding:8px 12px;font-weight:700;font-size:13px;white-space:nowrap}
h2.sec{font-size:15px;margin:18px 2px 8px;color:var(--green);display:flex;justify-content:space-between;align-items:baseline}
h2.sec small{font-weight:500;color:var(--muted);font-size:13px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;background:#fffdf7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--green)}
.stat span{font-size:12px;color:var(--muted)}
/* funnel */
.funnel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.funnel h3{margin:0 0 8px;font-size:14px;color:var(--green)}
.frow{display:grid;grid-template-columns:76px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.fbar{height:14px;background:#eee6d4;border-radius:8px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--green);border-radius:8px;min-width:2px}
.frow:nth-child(3) .fbar i{background:var(--fair)}
.frow:nth-child(4) .fbar i{background:var(--gold)}
.frow:nth-child(5) .fbar i{background:#a8822f}
.frow .pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.fnote{font-size:12px;color:var(--muted);margin-top:6px}
/* filters */
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.search{width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.card.dnc{opacity:.6;filter:grayscale(1)}
.card.dnc.open{opacity:.85}
.chead{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:0;padding:11px 12px}
.rank{flex:0 0 auto;min-width:48px;text-align:center;font-size:11px;font-weight:800;color:var(--green);background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:4px 4px}
.cmain{flex:1;min-width:0}
.cname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cside{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:120px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e9e2d0;color:var(--ink);white-space:nowrap}
.pill.sent{background:#dbe7df;color:var(--green)}
.pill.replied,.pill.interested{background:#f3e5bf;color:#6b4f12}
.pill.won{background:var(--green);color:#fff}
.pill.lost{background:#e4dfd7;color:#6b6259}
.pill.dnc{background:var(--ink);color:#fff}
.pill.hold{background:#f0dcc9;color:#7a3e10}
.due{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.due.over{color:var(--red)}
.due.today{color:#8a5a00}
.cbody{padding:0 12px 14px;border-top:1px solid #eee5d2}
.facts{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13.5px;margin:10px 0}
.facts b{color:var(--green)}
.box{border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.box.warn{background:var(--redbg);color:var(--red);border:1px solid #e9bdb3}
.box.info{background:#eef3ef;border:1px solid #cfdcd3;color:var(--green)}
.box.rules{background:#fff7e3;border:1px solid #ead9a8;color:#5a4410}
.box ul{margin:4px 0 0;padding-left:18px}
.box li{margin:2px 0}
.next{font-size:14px;margin:8px 0;font-weight:600}
.next span{font-weight:500;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.act{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--green);text-decoration:none;text-align:center}
.act.primary{background:var(--green);border-color:var(--green);color:#fff}
.act[aria-disabled=true],.act:disabled{opacity:.4;pointer-events:none}
.stbtns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:13.5px;font-weight:700;color:var(--ink)}
.sb.go{background:var(--green);border-color:var(--green);color:#fff}
.sb.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.sb.dncb{background:var(--ink);border-color:var(--ink);color:#fff}
.sb:disabled{opacity:.4}
.msg{border:1px solid #e6dcc5;border-radius:12px;margin:8px 0;background:#fff;overflow:hidden}
.msgh{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#faf6ea;font-size:13px;font-weight:700}
.msgh span{flex:1;min-width:0}
.msgh button{border:0;background:var(--green);color:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700}
.msgh button:disabled{opacity:.4}
.subj{padding:6px 10px 0;font-size:13px;color:var(--muted)}
.subj b{color:var(--ink)}
pre.mt{margin:0;padding:8px 10px 10px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font:13.5px/1.45 inherit;font-family:inherit}
mark.ph{background:#ffd9d2;color:var(--red);font-weight:800;padding:0 3px;border-radius:4px;outline:2px solid #e98a79}
mark.ph2{background:#f3e5bf;color:#6b4f12;font-weight:700;padding:0 3px;border-radius:4px}
label.lb{display:block;font-size:13px;font-weight:700;color:var(--green);margin:12px 0 4px}
textarea.notes{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:14px;resize:vertical}
.log{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px;max-height:220px;overflow-y:auto}
.log li{padding:5px 0;border-bottom:1px dashed #e8dfcb}
.log time{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
details.rn{margin-top:10px;font-size:13px;color:var(--muted)}
details.rn summary{font-weight:700;color:var(--green);cursor:pointer}
.more{width:100%;margin:6px 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;font-weight:700;color:var(--green)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(15,31,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheetbox{width:100%;max-width:640px;background:var(--cream);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheetbox h3{margin:0 0 6px;color:var(--green)}
.sheetbox p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.sheetbox .row{display:flex;gap:8px;margin-top:12px}
.sheetbox .row>*{flex:1}
.sheetbox textarea,.sheetbox input[type=date]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-size:15px}
.optlist{display:grid;gap:8px}
.optlist button{padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;text-align:left}
.sbtn{padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700}
.sbtn.go{background:var(--green);color:#fff;border-color:var(--green)}
.sbtn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheetbox img{width:100%;border-radius:10px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
</style>
</head>
<body>
<div id="lock" class="hidden"><form class="lockbox" id="lockform" autocomplete="off">
<img src="/assets/logo.svg" alt="7Acre Digital">
<h1>Outreach tracker</h1>
<p>Private. Enter your passcode to unlock.</p>
<input class="field" id="pass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Passcode" aria-label="Passcode">
<label class="chk"><input type="checkbox" id="remember" checked> Remember on this device</label>
<button class="btn-main" id="unlockbtn" type="submit">Unlock</button>
<div class="err" id="lockerr" role="alert"></div>
</form></div>
<div id="app" class="hidden">

<main class="wrap" id="main"></main>
</div>
<div id="sheet" class="hidden"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>(function(){
"use strict";
const META = window.__META__;
const LS_STATE = "7a_trk_state_v1";
const IDB_NAME = "7a_trk", IDB_STORE = "keys", IDB_KEY = "k";
const CH = {
  facebook:{label:"Facebook", icon:"📘"},
  email:{label:"Email", icon:"✉️"},
  call:{label:"Call", icon:"📞"},
  postcard:{label:"Postcard", icon:"📮"}
};
const STOP_RE = /(not interested|\bstop\b|no thanks|no thank you|unsubscribe|remove me|take me off|don'?t (contact|call|email|message|text)|leave me alone|do not contact)/i;
let KEY = null, DATA = null, S = null, BIZ = {}, ENT = {}, ENTS = [];
let view = "today", filter = "all", query = "", openSet = new Set(), showAllUntouched = false;

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const te = new TextEncoder(), td = new TextDecoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => { let s = ""; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const hex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ds = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const qsToday = new URLSearchParams(location.search).get("today");
const today = () => (qsToday && /^\d{4}-\d{2}-\d{2}$/.test(qsToday)) ? qsToday : ds(new Date());
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ds(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD = s => { if (!s) return ""; const d = parseD(s); return MON[d.getMonth()] + " " + d.getDate(); };
const nowStamp = () => { const d = new Date(); return ds(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2200); }

/* ---------- crypto ---------- */
const normPass = p => p.toLowerCase().replace(/[^a-z0-9]/g, "");
async function deriveKey(pass){
  const base = await crypto.subtle.importKey("raw", te.encode(normPass(pass)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:hex(META.salt), iterations:META.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function decryptPayload(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(META.iv)}, key, b64d(META.ct));
  return JSON.parse(td.decode(pt));
}
async function encJSON(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, KEY, te.encode(JSON.stringify(obj)));
  return {iv:b64e(iv), ct:b64e(ct)};
}
async function decJSON(o){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(o.iv)}, KEY, b64d(o.ct));
  return JSON.parse(td.decode(pt));
}
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open(IDB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(){ try { const db = await idb(); return await new Promise(res => { const q = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(IDB_KEY); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch(e){ return null; } }
async function idbPut(v){ try { const db = await idb(); await new Promise(res => { const t = db.transaction(IDB_STORE, "readwrite"); t.objectStore(IDB_STORE).put(v, IDB_KEY); t.oncomplete = res; t.onerror = res; }); } catch(e){} }
async function idbDel(){ try { const db = await idb(); await new Promise(res => { const t = db.transaction(IDB_STORE, "readwrite"); t.objectStore(IDB_STORE).delete(IDB_KEY); t.oncomplete = res; t.onerror = res; }); } catch(e){} }

/* ---------- state ---------- */
function blankEntry(e){ return {status:"new", step:0, sentAt:null, due:null, dueLabel:"", repliedAt:null, interestedAt:null, wonAt:null, lostAt:null, calls:[], replyNote:"", stopped:"", hold:!!e.hold}; }
function blankBiz(b){
  const o = {dnc:null, notes:"", log:[]};
  if (b.dncPreset){ o.dnc = {date:b.dncPreset.date, reason:b.dncPreset.reason}; o.log.push({t:b.dncPreset.date + " 00:00", ch:"", text:"Do Not Contact (preloaded): " + b.dncPreset.reason}); }
  return o;
}
function normalizeState(s){
  s = s && typeof s === "object" ? s : {};
  s.v = 1; s.entries = s.entries || {}; s.biz = s.biz || {};
  if (!s.firstUse) s.firstUse = today();
  if (!("lastBackup" in s)) s.lastBackup = null;
  for (const e of ENTS) s.entries[e.id] = Object.assign(blankEntry(e), s.entries[e.id] || {});
  for (const id in BIZ) if (!s.biz[id]) s.biz[id] = blankBiz(BIZ[id]);
  return s;
}
let saveChain = Promise.resolve();
function save(){ const snap = JSON.parse(JSON.stringify(S)); saveChain = saveChain.then(async () => { localStorage.setItem(LS_STATE, JSON.stringify(await encJSON(snap))); }).catch(e => console.warn("save failed", e)); return saveChain; }
async function loadState(){
  const raw = localStorage.getItem(LS_STATE);
  if (raw){ try { return normalizeState(await decJSON(JSON.parse(raw))); } catch(e){ console.warn("Saved data could not be opened with this passcode; starting fresh."); } }
  return normalizeState({});
}

/* ---------- lead helpers ---------- */
const es = e => S.entries[e.id];
const bs = e => S.biz[e.bid];
const isDnc = e => !!bs(e).dnc;
function log(bid, ch, text){ S.biz[bid].log.unshift({t:nowStamp(), ch, text}); }
function siblings(e){ return ENTS.filter(x => x.bid === e.bid && x.id !== e.id); }
function msgFor(e, key){ return e.messages.find(m => m.key === key); }
function nextMsg(e){
  const st = es(e), M = e.messages; if (!M.length) return null;
  if (e.channel === "facebook") return st.step >= 1 ? msgFor(e, "fb1") : msgFor(e, "fb0");
  if (e.channel === "email") return M[Math.min(st.step, 2)];
  if (e.channel === "call") return msgFor(e, "call");
  return M[0];
}
const emailMsgs = e => e.messages.filter(m => m.subject !== undefined);
function isDue(e){ const st = es(e); return !!st.due && st.due <= today() && !isDnc(e) && !st.hold && !st.stopped && (st.status === "sent" || st.status === "new"); }
function isUntouched(e){ const st = es(e); return st.status === "new" && !st.due && !isDnc(e) && !st.hold && !e.waitsFor; }
function matches(e, f){
  const st = es(e), d = isDnc(e);
  switch(f){
    case "all": return true;
    case "new": return st.status === "new" && !d;
    case "sent": return st.status === "sent" && !d && !isDue(e);
    case "due": return isDue(e);
    case "replied": return (st.status === "replied" || st.status === "interested") && !d;
    case "won": return st.status === "won";
    case "lost": return st.status === "lost" && !d;
    case "dnc": return d;
  }
  return true;
}
const byRank = (a, b) => (BIZ[a.bid].rankNum - BIZ[b.bid].rankNum) || (grp(a) - grp(b)) || BIZ[a.bid].name.localeCompare(BIZ[b.bid].name);
const grp = e => ({TX:0, FL:1, DFW:2})[BIZ[e.bid].rankLabel.split(" ")[0]] ?? 3;
function statusPill(e){
  const st = es(e);
  if (isDnc(e)) return '<span class="pill dnc">Do not contact</span>';
  if (st.hold) return '<span class="pill hold">On hold</span>';
  const map = {new:["","Not contacted"], sent:["sent", e.channel === "call" ? "Called" : e.channel === "postcard" ? "Mailed" : "Sent"], replied:["replied","Replied"], interested:["interested","Interested"], won:["won","Won"], lost:["lost","Lost"]};
  const [c, t] = map[st.status] || ["", st.status];
  return `<span class="pill ${c}">${t}</span>`;
}
function dueChip(e){
  const st = es(e); if (!st.due || isDnc(e) || st.stopped || ["replied","interested","won","lost"].includes(st.status)) return "";
  const n = daysBetween(today(), st.due);
  if (n < 0) return `<span class="due over">${-n}d overdue</span>`;
  if (n === 0) return '<span class="due today">Due today</span>';
  return `<span class="due">Due ${fmtD(st.due)}</span>`;
}
function hl(t){ return esc(t).replace(/\[MAILING ADDRESS\]/g, '<mark class="ph">[MAILING ADDRESS]</mark>').replace(/\[DEMO SCREENSHOT\]/g, '<mark class="ph2">[DEMO SCREENSHOT] attach preview image</mark>'); }
const telHref = p => "tel:+1" + String(p).replace(/\D/g, "").slice(-10);

/* ---------- compliance ---------- */
function rules(e){
  const b = BIZ[e.bid], r = [];
  if (b.state === "FL") r.push("<b>Florida: no calls and no texts.</b> Facebook, email or mail only. If they call or text you first, you can reply in that conversation.");
  if (b.state === "TX") r.push("<b>Texas: no cold texts.</b> Text the link only after a verbal yes on a call, and log the yes with date and time (TX SB 140).");
  if (e.channel === "email") r.push("<b>Email must include your mailing address and the opt-out line</b> (\"reply 'no thanks'\"). Replace <mark class=\"ph\">[MAILING ADDRESS]</mark> before sending. Stop on any reply; never email again after \"no thanks\".");
  if (e.channel === "facebook") r.push("Send from your own Facebook. One opener, one follow-up 4 days later, then stop.");
  if (e.channel === "call") r.push("Call first. Leave one voicemail, then try once more 3 to 4 days later without a second voicemail. If they say no, mark Do Not Contact.");
  if (e.channel === "postcard") r.push("Mail only. No follow-up calls or texts.");
  return '<div class="box rules"><b>Rules for this lead</b><ul>' + r.map(x => "<li>" + x + "</li>").join("") + "</ul></div>";
}

/* ---------- rendering ---------- */
function card(e){
  const b = BIZ[e.bid], st = es(e), d = isDnc(e), open = openSet.has(e.id);
  const sub = [b.city, b.state].filter(Boolean).join(", ") + " · " + CH[e.channel].icon + " " + CH[e.channel].label + (e.linked ? " (+" + siblings(e).map(x => CH[x.channel].label).join(", ") + ")" : "");
  let h = `<div class="card${d ? " dnc" : ""}${open ? " open" : ""}" data-id="${esc(e.id)}"><button class="chead" data-act="toggle" aria-expanded="${open}"><span class="rank">${esc(b.rankLabel)}</span><span class="cmain"><div class="cname">${esc(b.name)}</div><div class="csub">${esc(sub)}</div></span><span class="cside">${statusPill(e)}${dueChip(e)}</span></button>`;
  if (open) h += body(e);
  return h + "</div>";
}
function body(e){
  const b = BIZ[e.bid], st = es(e), bz = bs(e), d = isDnc(e), nm = nextMsg(e);

  const contact = [];
  if (b.phone) contact.push("☎ " + esc(b.phone));
  if (b.email) contact.push("✉ " + esc(b.email));
  if (b.address) contact.push("🏠 " + esc(b.address));
  if (contact.length) h += `<div class="facts" style="margin-top:-4px">${contact.map(c => `<span>${c}</span>`).join("")}</div>`;
  if (d) h += `<div class="box warn"><b>Do Not Contact</b> since ${fmtD(bz.dnc.date)}. ${esc(bz.dnc.reason || "")}<br>Every channel is locked for this business.</div>`;
  if (st.hold) h += `<div class="box warn"><b>On hold:</b> ${esc(e.holdReason || "")}</div>`;
  if (e.linked){
    const sib = siblings(e).map(x => `${CH[x.channel].label}: ${esc(statusText(x))}`).join("; ");

  }
  if (e.waitsFor && es(e).status === "new" && !es(e).due) h += '<div class="box info">Waiting on the Facebook opener. When you mark it sent, Email 1 comes due 2 days later.</div>';
  if (!d) h += rules(e);
  h += nextLine(e);
  const fb = b.facebook, em = emailMsgs(e), mailHref = em.length ? mailto(e) : "";
  const callOk = b.phone && b.state !== "FL" && !d;
  h += '<div class="grid2">';
  h += `<button class="act primary" data-act="copy" ${(!nm || d) ? "disabled" : ""}>📋 ${nm ? "Copy message" : "No script yet"}</button>`;
  h += fb ? `<a class="act" href="${esc(fb)}" target="_blank" rel="noopener noreferrer" ${d ? 'aria-disabled="true" tabindex="-1"' : ""}>📘 Open Facebook</a>` : '<button class="act" disabled>📘 No Facebook</button>';
  h += callOk ? `<a class="act" href="${telHref(b.phone)}" data-act="calltap">📞 Call</a>` : `<button class="act" disabled>📞 ${b.state === "FL" ? "No calls (FL)" : d ? "Call locked" : "No phone"}</button>`;
  h += (mailHref && !d) ? `<a class="act" href="${esc(mailHref)}" data-act="mailtap">✉️ Email</a>` : `<button class="act" disabled>✉️ ${d ? "Email locked" : siblings(e).some(x => x.channel === "email") ? "Email: see Email tab" : "No email"}</button>`;
  h += `<a class="act" href="${esc(e.demo)}" target="_blank" rel="noopener noreferrer">🌐 Open demo</a>`;
  h += b.preview ? '<button class="act" data-act="preview">🖼️ Save preview</button>' : '<button class="act" disabled>🖼️ No preview</button>';
  h += "</div>";
  h += statusButtons(e);
  if (e.messages.length){
    h += '<label class="lb">Messages</label>';
    for (const m of e.messages){
      h += `<div class="msg"><div class="msgh"><span>${esc(m.label)}</span><button data-act="copymsg" data-key="${esc(m.key)}" ${d ? "disabled" : ""}>Copy</button></div>${m.subject !== undefined ? `<div class="subj">Subject: <b>${esc(m.subject)}</b></div>` : ""}<pre class="mt">${hl(m.body)}</pre></div>`;
    }
  } else {
    h += '<div class="box info">No script has been written for this lead yet. Ask Dez or 7Acre for one.</div>';
  }
  h += `<label class="lb" for="n-${esc(e.id)}">Notes</label><textarea class="notes" id="n-${esc(e.id)}" data-act="notes" placeholder="Anything worth remembering…">${esc(bz.notes)}</textarea>`;
  h += '<label class="lb">Activity</label>';
  h += bz.log.length ? '<ul class="log">' + bz.log.map(l => `<li><time>${esc(l.t)}</time>${l.ch ? esc(CH[l.ch] ? CH[l.ch].label : l.ch) + ": " : ""}${esc(l.text)}</li>`).join("") + "</ul>" : '<div class="fnote">Nothing logged yet.</div>';
  if (b.researchNotes) h += `<details class="rn"><summary>Research notes</summary><p>${esc(b.researchNotes)}</p></details>`;
  return h + "</div>";
}
function statusText(e){
  const st = es(e);
  if (isDnc(e)) return "Do not contact";
  if (st.hold) return "On hold";
  const t = {new:"not contacted", sent:(e.channel === "call" ? "called" : e.channel === "postcard" ? "mailed" : "sent") + (st.sentAt ? " " + fmtD(st.sentAt) : ""), replied:"replied", interested:"interested", won:"won", lost:"lost"}[st.status];
  return t + (st.due && !st.stopped && (st.status === "sent" || st.status === "new") ? `, next due ${fmtD(st.due)}` : "");
}
function nextLine(e){
  const st = es(e);
  if (isDnc(e) || st.hold) return "";
  if (st.stopped) return `<div class="next">Stopped <span>· ${esc(st.stopped)}</span></div>`;
  if (["replied","interested","won","lost"].includes(st.status)) return "";
  if (st.due) return `<div class="next">Next: ${esc(st.dueLabel || "Follow-up")} <span>· due ${fmtD(st.due)}${daysBetween(today(), st.due) < 0 ? " (overdue)" : ""}</span></div>`;
  if (st.status === "sent" && st.dueLabel) return `<div class="next">${esc(st.dueLabel)}</div>`;
  return "";
}
function statusButtons(e){
  const st = es(e), d = isDnc(e);
  if (d) return '<div class="stbtns"><button class="sb" data-act="undnc">Remove Do Not Contact</button></div>';
  let h = '<div class="stbtns">';
  const closed = ["won","lost"].includes(st.status);
  if (e.channel === "call"){
    h += `<button class="sb go" data-act="logcall" ${closed ? "disabled" : ""}>📞 Log call</button>`;
  } else if (st.step === 0){
    h += `<button class="sb go" data-act="sent" ${(closed || st.hold) ? "disabled" : ""}>${e.channel === "postcard" ? "Mark mailed" : "Mark sent"}</button>`;
  } else {
    const maxFu = e.channel === "facebook" ? 2 : e.channel === "email" ? 3 : 1;
    if (st.step < maxFu && e.channel !== "postcard") h += `<button class="sb go" data-act="fu" ${(closed || st.stopped || st.status !== "sent") ? "disabled" : ""}>Mark follow-up sent${e.channel === "email" ? " (Email " + (st.step + 1) + ")" : ""}</button>`;
  }
  h += `<button class="sb" data-act="replied">💬 Replied</button>`;
  h += `<button class="sb gold" data-act="interested">⭐ Interested</button>`;
  h += `<button class="sb" data-act="won">🏆 Won</button>`;
  h += `<button class="sb" data-act="lost">Lost</button>`;
  h += `<button class="sb dncb" data-act="dnc">⛔ Do Not Contact</button>`;
  if (st.status !== "new" || st.step || st.due) h += `<button class="sb" data-act="reset">↺ Reset</button>`;
  return h + "</div>";
}
function mailto(e){
  const st = es(e), em = emailMsgs(e), m = em[Math.min(st.step, em.length - 1)], b = BIZ[e.bid];
  return "mailto:" + encodeURIComponent(b.email).replace(/%40/g, "@") + "?subject=" + encodeURIComponent(m.subject) + "&body=" + encodeURIComponent(m.body);
}
function funnel(ch){
  const list = ENTS.filter(e => e.channel === ch && !BIZ[e.bid].dncPreset);
  const total = list.length;
  const sent = list.filter(e => es(e).sentAt).length, rep = list.filter(e => es(e).repliedAt).length, intr = list.filter(e => es(e).interestedAt).length, won = list.filter(e => es(e).wonAt).length;
  const row = (lab, n, base) => `<div class="frow"><span>${lab} <b>${n}</b></span><span class="fbar"><i style="width:${total ? Math.round(n / total * 100) : 0}%"></i></span><span class="pct">${base === null ? "of " + total : base ? Math.round(n / base * 100) + "%" : "–"}</span></div>`;
  let worst = "";
  const steps = [["sent → replied", sent, rep], ["replied → interested", rep, intr], ["interested → won", intr, won]].filter(s => s[1] > 0);
  if (steps.length){ steps.sort((a, b) => (a[2] / a[1]) - (b[2] / b[1])); worst = `Biggest drop-off: <b>${steps[0][0]}</b>.`; }
  return `<div class="funnel"><h3>${CH[ch].icon} ${CH[ch].label} funnel</h3>${row("Sent", sent, null)}${row("Replied", rep, sent)}${row("Interested", intr, rep)}${row("Won", won, intr)}<div class="fnote">${worst || "Percentages show how many made it from the step above."}</div></div>`;
}
function banner(){
  let cls = "banner", txt, nag = false;
  if (S.lastBackup){
    const n = daysBetween(S.lastBackup.slice(0, 10), today());
    txt = "Last backup: " + (n <= 0 ? "today" : n === 1 ? "1 day ago" : n + " days ago");
    if (n >= 7){ nag = true; txt += ". Time to back up again."; }
  } else {
    const n = daysBetween(S.firstUse, today());
    txt = "No backup yet. Your data lives only on this device.";
    if (n >= 7){ nag = true; txt = "No backup in " + n + " days. Your data lives only on this device."; }
  }
  return `<div class="${cls}${nag ? " nag" : ""}" id="bk"><span>${txt}</span><button data-act="backup">Back up</button></div>`;
}
function render(){
  const tabs = ["today","facebook","email","call","postcard"];
  const dueN = ENTS.filter(isDue).length;
  $("#tabs").innerHTML = tabs.map(t => {
    if (t === "today") return `<button class="tab${view === t ? " on" : ""}" data-tab="today"><span class="ic">📅</span>Today<span class="n">${dueN} due</span></button>`;
    const n = ENTS.filter(e => e.channel === t && !isDnc(e)).length;
    return `<button class="tab${view === t ? " on" : ""}" data-tab="${t}"><span class="ic">${CH[t].icon}</span>${CH[t].label}<span class="n">${n}</span></button>`;
  }).join("");
  let h = banner();
  if (view === "today"){
    const due = ENTS.filter(isDue).sort(byRank);
    const unt = ENTS.filter(isUntouched).sort(byRank);
    const active = ENTS.filter(e => !isDnc(e));
    const contacted = active.filter(e => es(e).sentAt).length, replied = active.filter(e => es(e).repliedAt).length;
    h += `<div class="stats"><div class="stat"><b>${due.length}</b><span>due now</span></div><div class="stat"><b>${contacted}</b><span>contacted</span></div><div class="stat"><b>${replied}</b><span>replied</span></div></div>`;
    h += `<h2 class="sec">Follow-ups due today or overdue <small>${due.length}</small></h2>`;
    h += due.length ? due.map(card).join("") : '<div class="empty">Nothing due. Nice. Start on the untouched leads below.</div>';
    h += `<h2 class="sec">Not contacted yet <small>${unt.length}, by rank</small></h2>`;
    const shown = showAllUntouched ? unt : unt.slice(0, 12);
    h += shown.map(card).join("");
    if (unt.length > shown.length) h += `<button class="more" data-act="moreunt">Show all ${unt.length}</button>`;
  } else {
    const list = ENTS.filter(e => e.channel === view);
    h += funnel(view);
    const fl = [["all","All"],["new","Not contacted"],["sent","Sent"],["due","Follow-up due"],["replied","Replied"],["won","Won"],["lost","Lost"],["dnc","DNC"]];
    h += '<div class="chips">' + fl.map(([k, l]) => `<button class="chip${filter === k ? " on" : ""}" data-filter="${k}">${l} ${list.filter(e => matches(e, k)).length}</button>`).join("") + "</div>";
    h += `<input class="search" type="search" placeholder="Search ${CH[view].label} leads" value="${esc(query)}" data-act="search" aria-label="Search">`;
    const q = query.trim().toLowerCase();
    const shown = list.filter(e => matches(e, filter) && (!q || (BIZ[e.bid].name + " " + BIZ[e.bid].city).toLowerCase().includes(q))).sort((a, b) => (isDnc(a) - isDnc(b)) || byRank(a, b));
    h += `<h2 class="sec">${CH[view].label} leads <small>${shown.length} shown</small></h2>`;
    h += shown.length ? shown.map(card).join("") : '<div class="empty">No leads match this filter.</div>';
  }
  h += `<div class="foot">Data saved encrypted on this device · built ${esc(DATA.builtAt)}</div>`;
  $("#main").innerHTML = h;
}
function rerenderKeepFocus(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

/* ---------- sheet (modal) ---------- */
function sheet(html, onClick){
  const el = $("#sheet"); el.innerHTML = `<div class="sheetbox" role="dialog" aria-modal="true">${html}</div>`; el.classList.remove("hidden");
  el.onclick = ev => { if (ev.target === el){ closeSheet(); return; } const a = ev.target.closest("[data-s]"); if (a) onClick && onClick(a.dataset.s, el, a); };
}
function closeSheet(){ const el = $("#sheet"); el.classList.add("hidden"); el.innerHTML = ""; el.onclick = null; }
function confirmSheet(title, text, okLabel, ok, dark){
  sheet(`<h3>${title}</h3><p>${text}</p><div class="row"><button class="sbtn" data-s="no">Cancel</button><button class="sbtn ${dark ? "dark" : "go"}" data-s="ok">${okLabel}</button></div>`, s => { closeSheet(); if (s === "ok") ok(); });
}

/* ---------- actions ---------- */
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(err){
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e2){} ta.remove(); return ok;
  }
}
function commit(){ save(); rerenderKeepFocus(); }
function markSent(e){
  const st = es(e), t = today(), b = BIZ[e.bid];
  const doIt = () => {
    st.status = "sent"; st.step = 1; st.sentAt = t;
    if (e.channel === "facebook"){
      st.due = addDays(t, 4); st.dueLabel = "Facebook follow-up (day 4, once)";
      for (const s of siblings(e)){ const ss = es(s); if (s.channel === "email" && ss.status === "new" && !ss.due){ ss.due = addDays(t, 2); ss.dueLabel = "Email 1 (2 days after the Facebook opener)"; log(e.bid, "email", "Email 1 scheduled for " + fmtD(ss.due) + " (2 days after Facebook)"); } }
      log(e.bid, "facebook", "Facebook opener sent. Follow-up due " + fmtD(st.due));
    } else if (e.channel === "email"){
      st.due = addDays(t, 3); st.dueLabel = "Email 2 (day 3)";
      log(e.bid, "email", "Email 1 sent. Email 2 due " + fmtD(st.due));
    } else if (e.channel === "postcard"){
      st.due = null; st.dueLabel = "Mailed. Wait for them to reach out (no calls or texts in FL).";
      log(e.bid, "postcard", "Postcard mailed");
    }
    commit(); toast(e.channel === "postcard" ? "Marked mailed" : "Marked sent" + (st.due ? ", follow-up due " + fmtD(st.due) : ""));
  };
  if (e.channel === "email" && e.messages.some(m => m.body.includes("[MAILING ADDRESS]"))){
    confirmSheet("Mailing address in?", `This email still has <mark class="ph">[MAILING ADDRESS]</mark>. The law requires your real mailing address and the opt-out line in every email. Did you put your address in before sending?`, "Yes, mark sent", doIt);
  } else doIt();
}
function markFollowup(e){
  const st = es(e), t = today();
  st.step += 1;
  if (e.channel === "facebook"){ st.due = null; st.dueLabel = "Follow-up sent. Sequence done; wait for a reply, then stop."; log(e.bid, "facebook", "Facebook follow-up sent. Done, no more messages."); }
  else if (e.channel === "email"){
    if (st.step === 2){ st.due = addDays(st.sentAt || t, 7); st.dueLabel = "Email 3 (day 7, the last one)"; log(e.bid, "email", "Email 2 sent. Email 3 due " + fmtD(st.due)); }
    else { st.due = null; st.dueLabel = "All 3 emails sent. No more email" + (BIZ[e.bid].state === "TX" && BIZ[e.bid].phone ? "; a call is the next option." : "."); log(e.bid, "email", "Email 3 sent. Sequence done."); }
  }
  commit(); toast("Follow-up logged" + (st.due ? ", next due " + fmtD(st.due) : ""));
}
function stopOthers(e, why){ for (const s of siblings(e)){ const ss = es(s); if (ss.status === "new" || ss.status === "sent"){ ss.due = null; ss.stopped = why + " on " + CH[e.channel].label; } } }
function replied(e){
  sheet(`<h3>They replied</h3><p>Add a short note about what they said. Every follow-up for this business stops.</p><textarea id="rnote" rows="3" placeholder="e.g. Asked for price, wants a call Friday"></textarea><div class="row"><button class="sbtn" data-s="no">Cancel</button><button class="sbtn go" data-s="ok">Save reply</button></div>`, s => {
    if (s !== "ok"){ closeSheet(); return; }
    const note = ($("#rnote").value || "").trim(); closeSheet();
    const st = es(e); st.status = "replied"; st.repliedAt = st.repliedAt || today(); st.due = null; st.replyNote = note; st.stopped = "";
    stopOthers(e, "Replied");
    log(e.bid, e.channel, "Replied" + (note ? ': "' + note + '"' : ""));
    commit(); toast("Reply logged");
    if (STOP_RE.test(note)) setTimeout(() => dncPrompt(e, "They replied: \"" + note + "\""), 150);
  });
  setTimeout(() => { const t = $("#rnote"); t && t.focus(); }, 50);
}
function setInterested(e){ const st = es(e); st.status = "interested"; st.repliedAt = st.repliedAt || today(); st.interestedAt = st.interestedAt || today(); st.due = null; st.stopped = ""; stopOthers(e, "Interested"); log(e.bid, e.channel, "Marked interested"); commit(); toast("Marked interested"); }
function setWon(e){ confirmSheet("Mark as won?", "Nice. This marks " + esc(BIZ[e.bid].name) + " as a client.", "Mark won", () => { const st = es(e), t = today(); st.status = "won"; st.wonAt = t; st.interestedAt = st.interestedAt || t; st.repliedAt = st.repliedAt || t; st.due = null; stopOthers(e, "Won"); log(e.bid, e.channel, "WON 🎉"); commit(); toast("Won 🎉"); }); }
function setLost(e){ confirmSheet("Mark as lost?", "This stops follow-ups on this channel. It doesn't block other channels; use Do Not Contact for that.", "Mark lost", () => { const st = es(e); st.status = "lost"; st.lostAt = today(); st.due = null; log(e.bid, e.channel, "Marked lost"); commit(); toast("Marked lost"); }); }
function dncPrompt(e, why){
  confirmSheet("Mark Do Not Contact?", (why ? esc(why) + "<br><br>" : "") + "That sounds like a no. Do Not Contact locks <b>" + esc(BIZ[e.bid].name) + "</b> out of every channel (Facebook, email, calls, mail) and hides it from Today.", "⛔ Mark Do Not Contact", () => setDnc(e, why || ""), true);
}
function setDnc(e, reason){
  const bz = bs(e); bz.dnc = {date:today(), reason:reason || "Marked by Dennis"};
  for (const x of ENTS.filter(x => x.bid === e.bid)){ es(x).due = null; }
  log(e.bid, "", "Do Not Contact" + (reason ? ": " + reason : ""));
  commit(); toast("Locked: Do Not Contact");
}
function logCall(e){
  const tm = addDays(today(), 1);
  sheet(`<h3>Log call: ${esc(BIZ[e.bid].name)}</h3><p>What happened?</p><div class="optlist"><button data-s="noanswer">No answer</button><button data-s="voicemail">Left voicemail</button><button data-s="interested">⭐ Interested (said yes)</button><button data-s="notinterested">Not interested</button></div><label class="lb" for="cbd">Callback date</label><input type="date" id="cbd" value="${tm}" min="${today()}"><div class="row"><button class="sbtn" data-s="no">Cancel</button><button class="sbtn go" data-s="callback">Set callback</button></div>`, s => {
    if (s === "no"){ closeSheet(); return; }
    const st = es(e), t = today(), cb = ($("#cbd") || {}).value; closeSheet();
    const prevVm = st.calls.some(c => c.outcome === "voicemail");
    st.calls.push({date:t, outcome:s, callback:s === "callback" ? cb : ""}); st.step += 1; st.sentAt = st.sentAt || t; st.stopped = "";
    if (s === "noanswer"){ st.status = "sent"; st.due = addDays(t, 3); st.dueLabel = "Call again"; log(e.bid, "call", "No answer. Try again " + fmtD(st.due)); }
    if (s === "voicemail"){ st.status = "sent"; st.due = addDays(t, 3); st.dueLabel = prevVm ? "Last try (you already left a voicemail; don't leave another)" : "Call again, no second voicemail"; log(e.bid, "call", "Left voicemail. Try once more " + fmtD(st.due)); }
    if (s === "callback"){ st.status = "sent"; st.due = cb || addDays(t, 1); st.dueLabel = "Callback"; log(e.bid, "call", "Asked for a callback on " + fmtD(st.due)); }
    if (s === "interested"){ st.status = "interested"; st.repliedAt = st.repliedAt || t; st.interestedAt = st.interestedAt || t; st.due = null; log(e.bid, "call", "Interested on the call (verbal yes " + nowStamp() + ")"); }
    if (s === "notinterested"){ st.status = "lost"; st.lostAt = t; st.due = null; log(e.bid, "call", "Not interested"); }
    commit();
    if (s === "notinterested") setTimeout(() => dncPrompt(e, "They said not interested on the call."), 150);
    else if (s === "interested"){ const m = msgFor(e, "txt"); toast(m ? "Logged. You can text the link now (they said yes)." : "Logged as interested"); }
    else toast("Call logged" + (st.due ? ", next " + fmtD(st.due) : ""));
  });
}
async function showPreview(e){
  const b = BIZ[e.bid];
  try {
    const r = await fetch(b.preview); if (!r.ok) throw new Error("HTTP " + r.status);
    const buf = new Uint8Array(await r.arrayBuffer());
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0, 12)}, KEY, buf.slice(12));
    const fname = b.slug + ".jpg", blob = new Blob([pt], {type:"image/jpeg"}), url = URL.createObjectURL(blob);
    const file = new File([blob], fname, {type:"image/jpeg"});
    const canShare = !!(navigator.canShare && navigator.canShare({files:[file]}));
    sheet(`<h3>Preview image</h3><p>Press and hold the image to save it to Photos, or use the button.</p><img src="${url}" alt="Preview of the ${esc(b.name)} demo"><div class="row">${canShare ? '<button class="sbtn go" data-s="share">Save / Share</button>' : `<a class="sbtn go" style="text-align:center;text-decoration:none" href="${url}" download="${esc(fname)}">Download</a>`}<button class="sbtn" data-s="close">Close</button></div>`, async s => {
      if (s === "share"){ try { await navigator.share({files:[file]}); } catch(err){} }
      if (s === "close"){ closeSheet(); URL.revokeObjectURL(url); }
    });
  } catch(err){ console.warn(err); toast("Couldn't load the preview image"); }
}

/* ---------- export / import ---------- */
function csvCell(v){ v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportRows(){
  return ENTS.slice().sort(byRank).map(e => {
    const b = BIZ[e.bid], st = es(e), bz = bs(e);
    return {entry_id:e.id, rank:b.rankLabel, business:b.name, channel:e.channel, state:b.state, city:b.city, phone:b.phone, email:b.email, facebook:b.facebook, demo_link:e.demo,
      status:isDnc(e) ? "do not contact" : st.hold ? "on hold" : st.status, dnc_date:bz.dnc ? bz.dnc.date : "", dnc_reason:bz.dnc ? bz.dnc.reason : "",
      first_sent:st.sentAt || "", messages_sent:st.step, next_due:st.due || "", next_step:st.stopped ? "stopped: " + st.stopped : (st.dueLabel || ""),
      replied_at:st.repliedAt || "", reply_note:st.replyNote || "", interested_at:st.interestedAt || "", won_at:st.wonAt || "", lost_at:st.lostAt || "",
      calls:st.calls.map(c => c.date + " " + c.outcome + (c.callback ? " (callback " + c.callback + ")" : "")).join("; "),
      notes:bz.notes || "", last_activity:bz.log[0] ? bz.log[0].t + " " + bz.log[0].text : ""};
  });
}
function download(name, text, type){
  const blob = new Blob([text], {type}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return blob;
}
function exportData(kind){
  const stamp = today(), rows = exportRows();
  const summary = {}; for (const ch in CH){ const l = ENTS.filter(e => e.channel === ch); summary[ch] = {total:l.length, dnc:l.filter(isDnc).length, sent:l.filter(e => es(e).sentAt).length, replied:l.filter(e => es(e).repliedAt).length, interested:l.filter(e => es(e).interestedAt).length, won:l.filter(e => es(e).wonAt).length, due_now:l.filter(isDue).length}; }
  if (kind === "csv"){
    const cols = Object.keys(rows[0]);
    download(`7acre-outreach-${stamp}.csv`, "\ufeff" + [cols.join(",")].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(","))).join("\r\n"), "text/csv");
  } else {
    const activity = []; for (const id in S.biz) for (const l of S.biz[id].log) activity.push({business:BIZ[id] ? BIZ[id].name : id, time:l.t, channel:l.ch, text:l.text});
    activity.sort((a, b) => b.time.localeCompare(a.time));
    const out = {app:"7Acre outreach tracker", format:1, exported_at:new Date().toISOString(), today:stamp, summary, leads:rows, activity, state:S};
    download(`7acre-outreach-${stamp}.json`, JSON.stringify(out, null, 2), "application/json");
  }
  S.lastBackup = today() + " " + nowStamp().slice(11);
  commit(); toast(kind === "csv" ? "CSV downloaded" : "Backup downloaded");
}
function backupSheet(){
  sheet(`<h3>Back up or restore</h3><p>Export saves a copy of everything (statuses, dates, notes, activity) as a file you can keep or send to Dez. JSON restores everything; CSV opens in a spreadsheet.</p><div class="optlist"><button data-s="json">⬇️ Export backup (JSON)</button><button data-s="csv">⬇️ Export spreadsheet (CSV)</button><button data-s="import">⬆️ Import a backup (JSON)</button></div><div class="row"><button class="sbtn" data-s="no">Close</button></div>`, s => {
    if (s === "json" || s === "csv"){ closeSheet(); exportData(s); }
    if (s === "import"){ closeSheet(); $("#importfile").click(); }
    if (s === "no") closeSheet();
  });
}
async function importFile(f){
  try {
    const obj = JSON.parse(await f.text());
    const st = obj && obj.state ? obj.state : obj;
    if (!st || typeof st !== "object" || !st.entries || !st.biz) throw new Error("not a tracker backup");
    confirmSheet("Replace data with this backup?", `This replaces everything on this device with the backup from ${esc(obj.exported_at ? obj.exported_at.slice(0, 10) : "the file")}. Export first if you're not sure.`, "Import", () => { const lb = S.lastBackup; S = normalizeState(st); S.lastBackup = S.lastBackup || lb; commit(); toast("Backup imported"); });
  } catch(err){ toast("That file isn't a tracker backup"); }
}

/* ---------- events ---------- */
function bind(){
  $("#tabs").addEventListener("click", ev => { const t = ev.target.closest("[data-tab]"); if (!t) return; view = t.dataset.tab; filter = "all"; query = ""; render(); window.scrollTo(0, 0); });
  $("#main").addEventListener("click", async ev => {
    const f = ev.target.closest("[data-filter]"); if (f){ filter = f.dataset.filter; rerenderKeepFocus(); return; }
    const a = ev.target.closest("[data-act]"); if (!a) return;
    const act = a.dataset.act;
    if (act === "backup") return backupSheet();
    if (act === "moreunt"){ showAllUntouched = true; rerenderKeepFocus(); return; }
    const c = a.closest(".card"); if (!c) return;
    const e = ENT[c.dataset.id];
    if (act === "toggle"){ openSet.has(e.id) ? openSet.delete(e.id) : openSet.add(e.id); rerenderKeepFocus(); return; }
    if (isDnc(e) && ["copy","copymsg","calltap","mailtap","sent","fu","logcall"].includes(act)){ ev.preventDefault(); toast("Locked: Do Not Contact"); return; }
    if (act === "copy" || act === "copymsg"){
      const m = act === "copy" ? nextMsg(e) : msgFor(e, a.dataset.key); if (!m) return;
      const ok = await copyText(m.body);
      toast(ok ? (m.body.includes("[MAILING ADDRESS]") ? "Copied. Replace [MAILING ADDRESS] before sending." : "Copied: " + m.label) : "Copy failed. Press and hold the text instead.");
      return;
    }
    if (act === "calltap"){ log(e.bid, "call", "Tapped Call"); save(); return; }
    if (act === "mailtap"){ toast("Replace [MAILING ADDRESS] before you hit send"); return; }
    if (act === "preview") return showPreview(e);
    if (act === "sent") return markSent(e);
    if (act === "fu") return markFollowup(e);
    if (act === "logcall") return logCall(e);
    if (act === "replied") return replied(e);
    if (act === "interested") return setInterested(e);
    if (act === "won") return setWon(e);
    if (act === "lost") return setLost(e);
    if (act === "dnc") return dncPrompt(e, "");
    if (act === "undnc") return confirmSheet("Remove Do Not Contact?", "Only do this if they asked to hear from you again.", "Remove", () => { bs(e).dnc = null; log(e.bid, "", "Do Not Contact removed"); commit(); });
    if (act === "reset") return confirmSheet("Reset this channel?", "Sets " + CH[e.channel].label + " back to not contacted and clears its dates. Notes and activity stay.", "Reset", () => { S.entries[e.id] = blankEntry(e); log(e.bid, e.channel, "Reset to not contacted"); commit(); });
  });
  let nt;
  $("#main").addEventListener("input", ev => {
    const a = ev.target.closest("[data-act]"); if (!a) return;
    if (a.dataset.act === "search"){ query = a.value; const pos = a.selectionStart; render(); const s = $(".search"); if (s){ s.focus(); try { s.setSelectionRange(pos, pos); } catch(e){} } return; }
    if (a.dataset.act === "notes"){ const e = ENT[a.closest(".card").dataset.id]; bs(e).notes = a.value; clearTimeout(nt); nt = setTimeout(save, 400); }
  });
  $("#main").addEventListener("change", ev => { const a = ev.target.closest('[data-act="notes"]'); if (a){ const e = ENT[a.closest(".card").dataset.id]; log(e.bid, "", "Notes updated"); save(); } });
  $("#lockbtn").addEventListener("click", async () => { await idbDel(); await saveChain; location.reload(); });
  $("#menubtn").addEventListener("click", backupSheet);
  $("#importfile").addEventListener("change", ev => { const f = ev.target.files[0]; if (f) importFile(f); ev.target.value = ""; });
  window.addEventListener("pagehide", () => { /* saves are already queued */ });
}

/* ---------- boot ---------- */
async function start(key, remember){
  const data = await decryptPayload(key);
  KEY = key; DATA = data;
  for (const b of data.businesses) BIZ[b.id] = b;
  ENTS = data.entries; for (const e of ENTS) ENT[e.id] = e;
  S = await loadState(); save();
  if (remember) await idbPut({salt:META.salt, key});
  $("#lock").classList.add("hidden"); $("#app").classList.remove("hidden");
  bind(); render();
}
async function boot(){
  if (!window.crypto || !crypto.subtle){ $("#lockerr").textContent = "This browser can't open the tracker (needs HTTPS and a modern browser)."; return; }
  const saved = await idbGet();
  if (saved && saved.salt === META.salt && saved.key){
    try { await start(saved.key, false); return; } catch(e){ await idbDel(); }
  }
  $("#lock").classList.remove("hidden");
  const form = $("#lockform");
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = $("#unlockbtn"), pass = $("#pass").value;
    if (!pass.trim()) return;
    btn.disabled = true; btn.textContent = "Unlocking…"; $("#lockerr").textContent = "";
    try { const k = await deriveKey(pass); await start(k, $("#remember").checked); }
    catch(e){ $("#lockerr").textContent = "That passcode didn't work. Try again."; btn.disabled = false; btn.textContent = "Unlock"; }
  });
  $("#pass").focus();
}
boot();
})();
</script>
