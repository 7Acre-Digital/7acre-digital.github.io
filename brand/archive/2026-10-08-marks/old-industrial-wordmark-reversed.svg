<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 832 246" width="832" height="246">
  <title>Seven Acre Digital</title><rect x="-40" y="-40" width="832" height="246" fill="#141414"/>
  <defs>
    <clipPath id="cap" clipPathUnits="userSpaceOnUse"><rect x="-40" y="0" width="2000" height="100"/></clipPath>
    <pattern id="hazard" patternUnits="userSpaceOnUse" width="28" height="28" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#141414"/>
      <rect width="14" height="28" fill="#FF5A1F"/>
    </pattern>
    <g id="S"><path d="M55,9 H23 L9,23 V36 L23,50 H41 L55,64 V77 L41,91 H9"/></g>
    <g id="E"><path d="M55,9 H9 V91 H55 M9,50 H48"/></g>
    <g id="V"><path d="M0,-12 L32,104 L64,-12"/></g>
    <g id="N"><path d="M9,110 V-5 L55,105 V-10"/></g>
    <g id="A"><path d="M0,112 L32,-6 L64,112"/><rect x="25" y="70" width="14" height="14" fill="#FF5A1F" stroke="none"/></g>
    <g id="C"><path d="M55,9 H23 L9,23 V77 L23,91 H55"/></g>
    <g id="R"><path d="M9,110 V9 H41 L55,23 V36 L41,50 H9 M34,50 L58,112"/></g>
    <g id="D"><path d="M9,9 H37 L55,27 V73 L37,91 H9 Z"/></g>
    <g id="I"><path d="M9,0 V100"/></g>
    <g id="G"><path d="M55,9 H23 L9,23 V77 L23,91 H41 L55,77 V50 H34"/></g>
    <g id="T"><path d="M0,9 H64 M32,9 V100"/></g>
    <g id="L"><path d="M9,0 V91 H55"/></g>
  </defs>

  <g fill="none" stroke="#EDEDED" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10">
    <!-- SEVEN ACRE -->
    <g clip-path="url(#cap)">
      <use href="#S" x="0"/><use href="#E" x="80"/><use href="#V" x="160"/><use href="#E" x="240"/><use href="#N" x="320"/>
      <use href="#A" x="448"/><use href="#C" x="528"/><use href="#R" x="608"/><use href="#E" x="688"/>
    </g>

    <!-- hazard bar -->
    <rect x="0" y="128" width="424" height="38" fill="url(#hazard)" stroke="none"/>

    <!-- DIGITAL -->
    <g transform="translate(457.1 128) scale(0.38)">
      <g clip-path="url(#cap)">
        <use href="#D" x="0"/><use href="#I" x="134"/><use href="#G" x="222"/><use href="#I" x="356"/>
        <use href="#T" x="444"/><use href="#A" x="578"/><use href="#L" x="712"/>
      </g>
    </g>
  </g>
</svg>
