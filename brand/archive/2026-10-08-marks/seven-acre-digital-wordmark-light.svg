    <g id="E"><path d="M78,6 H6 V54 H78 M6,30 H70"/></g>
    <g id="V"><path d="M0,-10 L42,64 L84,-10"/></g>
    <g id="N"><path d="M6,70 V-4 L78,64 V-10"/></g>
    <g id="A"><path d="M0,70 L42,-8 L84,70 M-2,6 H42"/></g>
    <g id="C"><path d="M78,6 H20 A14,14 0 0 0 6,20 V40 A14,14 0 0 0 20,54 H78"/></g>
    <g id="R"><path d="M6,70 V6 H66 A12,12 0 0 1 78,18 A12,12 0 0 1 66,30 H6 M50,30 L86,72"/></g>
